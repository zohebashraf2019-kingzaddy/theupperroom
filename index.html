<body class="gate">

  <!-- Opening doors -->
  <div class="curtain l" aria-hidden="true"></div>
  <div class="curtain r" aria-hidden="true"></div>
  <div class="curtain-glow" aria-hidden="true">
    <svg viewBox="0 0 100 130" fill="none" stroke="#f3dfb4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 126V60C8 34 26 14 50 4C74 14 92 34 92 60V126Z" stroke-width="3"/>
      <path d="M50 30V104M37 48H63" stroke-width="5"/>
      <path d="M27 64V104M19 74H35M73 64V104M65 74H81" stroke-width="3.5"/>
    </svg>
  </div>

  <div class="gate-center">
    <svg class="gate-emblem" viewBox="0 0 100 130" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset=".5" stop-color="#b76e79"/><stop offset=".5" stop-color="#e7cf9d"/></linearGradient></defs>
      <path d="M8 126V60C8 34 26 14 50 4C74 14 92 34 92 60V126Z" stroke="url(#g)" stroke-width="3"/>
      <path d="M50 30V104M37 48H63" stroke="url(#g)" stroke-width="5"/>
      <path d="M27 64V104M19 74H35" stroke="#b76e79" stroke-width="3.5"/>
      <path d="M73 64V104M65 74H81" stroke="#e7cf9d" stroke-width="3.5"/>
    </svg>
    <h1 class="gate-title"><small>The</small>Upper Room</h1>
    <p class="gate-sub">Two callings. Two crafts. One vision.</p>
    <div class="gate-choose"><span>Beauty</span><i></i><span>Barber</span></div>
  </div>

  <main class="gate-split">
    <a class="door door--beauty" href="/beauty" aria-label="Enter The Upper Room Beauty Studio">
      <video data-autoplay muted loop playsinline preload="metadata" poster="/assets/video/lash-set.jpg">
        <source src="/assets/video/lash-set.mp4" type="video/mp4" />
      </video>
      <div class="door-inner">
        <img class="logo" src="/assets/img/beauty-logo.webp" alt="The Upper Room Beauty Studio logo" />
        <p class="services">Lashes · Korean Lifts · Skin · Wax</p>
        <span class="enter">Enter Beauty Studio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
        <p class="who">with Evelyn &amp; Annie · Suite 20</p>
      </div>
    </a>

    <a class="door door--barber" href="/barber" aria-label="Enter The Upper Room Barber Studio">
      <video data-autoplay muted loop playsinline preload="metadata" poster="/assets/video/barber-fade.jpg">
        <source src="/assets/video/barber-fade.mp4" type="video/mp4" />
      </video>
      <div class="door-inner">
        <img class="logo" src="/assets/img/barber-logo.webp" alt="The Upper Room Barber Studio logo" />
        <p class="services">Cuts · Fades · Beards · Designs · Kids</p>
        <span class="enter">Enter Barber Studio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
        <p class="who">with Brian · Suite 19</p>
      </div>
    </a>
  </main>
  <div class="gate-divider" aria-hidden="true"></div>

  <div class="gate-foot"><span>1479 S. Wells Ave · Reno, Nevada · Faith at the center</span></div>

  <script src="/assets/js/main.js" defer></script>

</html>
